<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body class="admin-shell">
  <div class="admin-topbar">
    <a class="admin-topbar__brand" href="dashboard.html">💕 Loversite Admin</a>
    <div class="admin-topbar__nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="create.html">+ New Page</a>
      <button class="btn btn-outline" id="logout-btn" style="padding: 8px 16px;">Log Out</button>
    </div>
  </div>

  <main class="admin-main">
    <div class="section-title" style="text-align:left; margin-bottom:20px;">
      <h2>Customers &amp; Orders</h2>
      <p>Every order, its plan/status, and whether a Loversite page has been created yet.</p>
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table" id="customers-table">
        <thead>
          <tr>
            <th>Couple</th>
            <th>Email / Phone</th>
            <th>Plan</th>
            <th>Status</th>
            <th>Expiry</th>
            <th>Page</th>
            <th>Views</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="customers-tbody">
          <tr><td colspan="8">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabaseClient.js"></script>
  <script src="../assets/js/admin-auth.js"></script>
  <script src="../assets/js/admin-dashboard.js"></script>
</body>
</html>
